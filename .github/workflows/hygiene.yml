name: hygiene

# Lightweight integrity floor.  Runs the same checks a contributor can
# run locally with `python check_hygiene.py`:
#   1. every tracked Python file compiles;
#   2. no generated solver artifact is tracked;
#   3. local Markdown links resolve;
#   4. catalog/theorem-ledger.json integrity (existence, recomputed hashes,
#      provenance contract, census-vs-entries validation);
#   5. portability regression scan (no machine-specific paths);
#   6. the five fast verifiers run and exit zero;
#   7. dependency/solver versions are displayed.
# test_*.py files read tmp/ audit fixtures produced by the certificate
# replay chains; they stay manual (see docs/current-frontier.md, audit
# section) because their inputs are regenerable, not tracked.
#
# Expensive certificate replays (Singular Groebner runs, SAT/DRAT
# chains) are deliberately NOT in CI; they remain manual, documented
# per certificate, and reproducible via the pinned requirements.lock.txt
# and the Containerfile.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: protects against missed pull_request deliveries and
  # lets a reviewer re-run the floor on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # full history: provenance checks may need more than a tip
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run hygiene checks
        run: python check_hygiene.py

      - name: Run migration-tool tests
        run: python -m unittest -v tests.test_migration_tools

      - name: Run the self-contained test module
        run: python -m unittest -v test_fourteen_vertex_cycle_cover_lattice.py

      - name: Rewriter closure (committed head is a fixed point)
        # A clean committed PR head must already be a fixed point of the
        # migration rewriter: running it must rewrite nothing.  This
        # catches the Stage 4 class of failure where rewrites were
        # generated locally but never staged into the merged commit.
        run: |
          python tools/migration/rewrite_links.py
          git diff --exit-code
