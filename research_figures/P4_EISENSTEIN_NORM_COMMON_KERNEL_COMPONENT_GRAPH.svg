<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650">
  <defs>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 17px system-ui, sans-serif; fill: #4b5568; }
      .node { fill: #fffdf8; stroke: #172033; stroke-width: 4; }
      .nodeText { font: 700 24px system-ui, sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
      .full { stroke: #a5adbd; stroke-width: 5; stroke-dasharray: 13 10; }
      .rank1 { stroke: #1479c9; stroke-width: 8; }
      .rank2 { stroke: #c13aa3; stroke-width: 8; }
      .edgeText { font: 600 17px system-ui, sans-serif; fill: #172033; text-anchor: middle; paint-order: stroke; stroke: #fffdf8; stroke-width: 7; }
      .legend { font: 16px system-ui, sans-serif; fill: #344054; }
      .box { fill: #f8fafc; stroke: #d5dae3; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="920" height="650" fill="#fffdf8"/>
  <text x="460" y="46" class="title" text-anchor="middle">Eisenstein-norm common-kernel component</text>
  <text x="460" y="76" class="subtitle" text-anchor="middle">generic pair profile (4,4,4,3,3,3)</text>

  <line x1="460" y1="150" x2="190" y2="355" class="full"/>
  <line x1="460" y1="150" x2="730" y2="355" class="full"/>
  <line x1="460" y1="150" x2="460" y2="555" class="full"/>

  <line x1="190" y1="355" x2="730" y2="355" class="rank2"/>
  <line x1="190" y1="355" x2="460" y2="555" class="rank1"/>
  <line x1="730" y1="355" x2="460" y2="555" class="rank1"/>

  <text x="460" y="342" class="edgeText">rank-2: y₁x₂ − x₁y₂</text>
  <text x="304" y="477" class="edgeText" transform="rotate(36 304 477)">rank-1: x₁y₃ = ac</text>
  <text x="616" y="477" class="edgeText" transform="rotate(-36 616 477)">rank-1: x₂y₃ = ac</text>

  <circle cx="460" cy="150" r="42" class="node"/>
  <circle cx="190" cy="355" r="42" class="node"/>
  <circle cx="730" cy="355" r="42" class="node"/>
  <circle cx="460" cy="555" r="42" class="node"/>
  <text x="460" y="150" class="nodeText">0</text>
  <text x="190" y="355" class="nodeText">1</text>
  <text x="730" y="355" class="nodeText">2</text>
  <text x="460" y="555" class="nodeText">3</text>

  <rect x="57" y="112" width="285" height="112" class="box"/>
  <line x1="82" y1="145" x2="145" y2="145" class="rank1"/>
  <text x="160" y="151" class="legend">coefficient-rank 1</text>
  <line x1="82" y1="181" x2="145" y2="181" class="rank2"/>
  <text x="160" y="187" class="legend">coefficient-rank 2</text>
  <line x1="82" y1="213" x2="145" y2="213" class="full"/>
  <text x="160" y="219" class="legend">pair-image rank 4</text>

  <rect x="578" y="112" width="285" height="112" class="box"/>
  <text x="720" y="145" class="legend" text-anchor="middle">shared exact pair</text>
  <text x="720" y="177" class="edgeText">a = X₀+X₁</text>
  <text x="720" y="205" class="edgeText">c = X₀−X₁,  ac = 0</text>
</svg>
