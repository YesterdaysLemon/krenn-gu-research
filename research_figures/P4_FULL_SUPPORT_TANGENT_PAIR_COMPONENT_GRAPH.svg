<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef8f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1000" height="700" rx="28" fill="url(#bg)"/>
  <text x="500" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#17324d">Fourteenth pure P₄ component</text>
  <text x="500" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#456">tangent Segre pencil + ternary polar graph</text>

  <g stroke-linecap="round" fill="none">
    <path d="M330 280 L670 280" stroke="#d1495b" stroke-width="13"/>
    <path d="M326 294 L674 294" stroke="#7d2031" stroke-width="4" stroke-dasharray="11 9"/>
    <path d="M330 280 L500 520" stroke="#e6a817" stroke-width="8"/>
    <path d="M670 280 L500 520" stroke="#e6a817" stroke-width="8"/>
    <path d="M330 280 L500 170" stroke="#4c956c" stroke-width="6"/>
    <path d="M670 280 L500 170" stroke="#4c956c" stroke-width="6"/>
    <path d="M500 170 L500 520" stroke="#4c956c" stroke-width="6"/>
  </g>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <circle cx="330" cy="280" r="64" fill="#fff" stroke="#244b6b" stroke-width="5"/>
      <circle cx="670" cy="280" r="64" fill="#fff" stroke="#244b6b" stroke-width="5"/>
      <circle cx="500" cy="170" r="64" fill="#fff" stroke="#244b6b" stroke-width="5"/>
      <circle cx="500" cy="520" r="64" fill="#fff" stroke="#244b6b" stroke-width="5"/>
    </g>
    <text x="330" y="271" font-size="27" font-weight="700" fill="#17324d">U₀</text>
    <text x="330" y="301" font-size="16" fill="#456">span(e,w)</text>
    <text x="670" y="271" font-size="27" font-weight="700" fill="#17324d">U₁</text>
    <text x="670" y="301" font-size="16" fill="#456">span(e,w)</text>
    <text x="500" y="161" font-size="27" font-weight="700" fill="#17324d">U₃</text>
    <text x="500" y="191" font-size="15" fill="#456">graph(tℓ | u⊥)</text>
    <text x="500" y="511" font-size="27" font-weight="700" fill="#17324d">U₂</text>
    <text x="500" y="541" font-size="16" fill="#456">span(e,u)</text>

    <rect x="405" y="315" width="190" height="57" rx="14" fill="#fff3f4" stroke="#d1495b" stroke-width="2"/>
    <text x="500" y="339" font-size="17" font-weight="700" fill="#8d2235">rank 2 tangent edge</text>
    <text x="500" y="361" font-size="14" fill="#6b3942">e⊗e, e⊗w−w⊗e</text>

    <text x="401" y="430" font-size="17" font-weight="700" fill="#946b00">rank 3</text>
    <text x="599" y="430" font-size="17" font-weight="700" fill="#946b00">rank 3</text>
    <text x="405" y="205" font-size="16" font-weight="700" fill="#2f6b4b">rank 4</text>
    <text x="595" y="205" font-size="16" font-weight="700" fill="#2f6b4b">rank 4</text>
    <text x="527" y="420" font-size="16" font-weight="700" fill="#2f6b4b">rank 4</text>

    <rect x="170" y="605" width="660" height="57" rx="17" fill="#17324d"/>
    <text x="500" y="631" font-size="18" fill="#fff">P₄|U = y₀y₁ (x₂+tE y₂) (L₁x₃+L₂y₃)</text>
    <text x="500" y="653" font-size="14" fill="#bfe0ff">pair profile (2,3,4,3,4,4) • five-dimensional component</text>
  </g>
</svg>
